<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Овечки и цветочки 🐑🌸</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #8fd6ff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  canvas {
    display: block;
    position: absolute;
    inset: 0;
    cursor: crosshair;
  }

  .panel {
    position: absolute;
    top: 16px;
    left: 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 2px solid rgba(255, 255, 255, 0.8);
    border-radius: 20px;
    box-shadow: 0 8px 28px rgba(40, 80, 40, 0.18);
    user-select: none;
    z-index: 10;
  }

  .panel button {
    font: inherit;
    font-weight: 600;
    font-size: 15px;
    color: #2f4a2a;
    padding: 9px 16px;
    background: #ffffff;
    border: 2px solid #b9e3a2;
    border-radius: 14px;
    cursor: pointer;
    transition: transform .12s ease, background .18s ease, box-shadow .18s ease;
    box-shadow: 0 3px 0 #b9e3a2;
  }

  .panel button:hover {
    background: #f1ffe8;
    transform: translateY(-1px);
    box-shadow: 0 4px 0 #b9e3a2;
  }

  .panel button:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #b9e3a2;
  }

  .count {
    font-size: 14px;
    font-weight: 600;
    color: #3d5c35;
    padding-left: 4px;
  }

  .count b { color: #1f7a2e; }

  .hint {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    padding: 9px 20px;
    font-size: 14px;
    font-weight: 600;
    color: #35522d;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 999px;
    border: 2px solid rgba(255, 255, 255, 0.85);
    white-space: nowrap;
    pointer-events: none;
    z-index: 10;
  }

  @media (max-width: 620px) {
    .panel { top: 10px; left: 10px; right: 10px; padding: 10px; gap: 8px; border-radius: 16px; }
    .panel button { font-size: 13px; padding: 7px 11px; }
    .count { font-size: 12px; }
    .hint { font-size: 12px; padding: 7px 14px; white-space: normal; text-align: center; width: 90%; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div class="panel">
  <button id="addSheep">🐑 Ещё овечку</button>
  <button id="addFlower">🌸 Ещё цветочек</button>
  <span class="count">Овечек: <b id="sheepCount">0</b> · Цветочков: <b id="flowerCount">0</b></span>
</div>

<div class="hint">Клик по полю — посадить цветок · Клик по овечке — она подпрыгнет 🐑</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, groundY = 0;
  let skyGrad, fieldGrad;
  let clouds = [];
  let tufts = [];
  const sheep = [];
  const flowers = [];

  const MAX_FLOWERS = 220;
  const MAX_SHEEP = 30;

  /* ---------- Утилиты ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  /* ---------- Размер и градиенты ---------- */
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    groundY = H * 0.40;

    skyGrad = ctx.createLinearGradient(0, 0, 0, groundY + 40);
    skyGrad.addColorStop(0, '#79cdfb');
    skyGrad.addColorStop(0.55, '#b9e7ff');
    skyGrad.addColorStop(1, '#eaf9e4');

    fieldGrad = ctx.createLinearGradient(0, groundY, 0, H);
    fieldGrad.addColorStop(0, '#9ad474');
    fieldGrad.addColorStop(0.35, '#7cc457');
    fieldGrad.addColorStop(1, '#4f9b3a');

    makeClouds();
    makeTufts();
  }

  function makeClouds() {
    clouds = [];
    const n = W < 600 ? 3 : 5;
    for (let i = 0; i < n; i++) {
      clouds.push({
        x: Math.random() * W,
        y: H * 0.04 + Math.random() * H * 0.20,
        s: rand(0.55, 1.15) * (W < 600 ? 0.75 : 1),
        v: rand(5, 14)
      });
    }
  }

  function makeTufts() {
    tufts = [];
    const n = Math.round((W * (H - groundY)) / 9000);
    for (let i = 0; i < n; i++) {
      const y = rand(groundY + 8, H);
      tufts.push({
        x: Math.random() * W,
        y,
        h: rand(6, 16),
        s: scaleAt(y) * 0.9,
        hue: rand(88, 112),
        phase: Math.random() * Math.PI * 2
      });
    }
    tufts.sort((a, b) => a.y - b.y);
  }

  // Чем ниже на экране — тем крупнее
  function scaleAt(y) {
    const t = clamp((y - groundY) / (H - groundY), 0, 1);
    return 0.45 + 0.85 * t;
  }

  /* ---------- Овечка ---------- */
  class Sheep {
    constructor(x, y) {
      const minY = groundY + 45;
      const maxY = Math.max(minY + 20, H - 35);
      this.x = (x !== undefined) ? x : Math.random() * W;
      this.y = (y !== undefined) ? y : rand(minY, maxY);
      this.dir = Math.random() < 0.5 ? -1 : 1;
      this.speed = rand(18, 42);
      this.walkT = Math.random() * 10;
      this.idlePhase = Math.random() * 10;
      this.state = 'walk';
      this.stateTime = rand(1.2, 4);
      this.bounce = 0;
    }

    get s() { return scaleAt(this.y); }

    jump() {
      if (this.bounce <= 0.02) this.bounce = 1;
    }

    update(dt) {
      this.stateTime -= dt;
      if (this.stateTime <= 0) {
        if (this.state === 'walk') {
          this.state = 'idle';
          this.stateTime = rand(0.9, 2.8);
        } else {
          this.state = 'walk';
          this.stateTime = rand(1.6, 4.5);
          this.dir = Math.random() < 0.5 ? -1 : 1;
        }
      }

      if (this.state === 'walk') {
        this.x += this.dir * this.speed * dt;
        this.walkT += dt;
        const pad = 45;
        if (this.x < pad) { this.x = pad; this.dir = 1; }
        if (this.x > W - pad) { this.x = W - pad; this.dir = -1; }
      } else {
        this.idlePhase += dt;
      }

      this.y = clamp(this.y, groundY + 40, H - 30);

      if (this.bounce > 0) this.bounce = Math.max(0, this.bounce - dt * 1.5);
    }

    draw(t) {
      const s = this.s;
      const hopping = this.bounce > 0.02;
      const hop = hopping ? Math.sin(this.bounce * Math.PI) * 46 * s : 0;
      const bob = this.state === 'walk' ? Math.sin(this.walkT * 9) * 1.6 * s : 0;
      const x = this.x;
      const y = this.y - hop + bob;

      // Тень
      ctx.fillStyle = 'rgba(30, 70, 30, 0.16)';
      ctx.beginPath();
      ctx.ellipse(this.x, this.y + 2, 30 * s * (1 - hop / 90), 8 * s, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(x, y);
      ctx.scale(s * this.dir, s);

      // Ножки
      const swing = this.state === 'walk' ? Math.sin(this.walkT * 9) * 3.5 : 0;
      ctx.strokeStyle = '#4b3f38';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      const legs = [[-15, swing], [-5, -swing], [8, -swing], [17, swing]];
      for (const [lx, sw] of legs) {
        ctx.beginPath();
        ctx.moveTo(lx, -14);
        ctx.lineTo(lx + sw, -1);
        ctx.stroke();
      }

      // Пушистое тело
      const fluff = [
        [-18, -30, 13], [-5, -37, 15], [10, -33, 13],
        [-21, -19, 13], [17, -19, 12], [0, -19, 16],
        [-9, -26, 15], [9, -25, 14], [-1, -33, 13]
      ];
      ctx.fillStyle = '#fdfdf8';
      ctx.strokeStyle = '#e0ddd0';
      ctx.lineWidth = 1.6;
      for (const [cx, cy, r] of fluff) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      // Голова
      ctx.save();
      ctx.translate(23, -31);
      ctx.rotate(-0.16);

      // Ухо
      ctx.fillStyle = '#3f3a3e';
      ctx.beginPath();
      ctx.ellipse(-8, -7, 7.5, 4.5, -0.55, 0, Math.PI * 2);
      ctx.fill();

      // Морда
      ctx.fillStyle = '#4a4448';
      ctx.beginPath();
      ctx.ellipse(0, 0, 11.5, 13, 0, 0, Math.PI * 2);
      ctx.fill();

      // Глаз
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(4, -3.5, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#101014';
      ctx.beginPath();
      ctx.arc(4.9, -3.5, 1.6, 0, Math.PI * 2);
      ctx.fill();

      // Носик
      ctx.fillStyle = '#d98aa0';
      ctx.beginPath();
      ctx.ellipse(6, 6, 3, 2.2, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
      ctx.restore();

      // Восклицание при прыжке
      if (hopping) {
        const alpha = clamp(this.bounce * 2.2, 0, 1);
        const fs = Math.round(15 * s);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.font = `bold ${fs}px system-ui, -apple-system, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 5 * s;
        ctx.strokeStyle = 'rgba(255,255,255,0.95)';
        ctx.strokeText('Бе-е-е!', this.x, y - 62 * s - hop * 0.25);
        ctx.fillStyle = '#2f4a2a';
        ctx.fillText('Бе-е-е!', this.x, y - 62 * s - hop * 0.25);
        ctx.restore();
      }
    }
  }

  /* ---------- Цветочек ---------- */
  class Flower {
    constructor(x, y) {
      this.x = x;
      this.y = clamp(y, groundY + 12, H - 6);
      this.hue = [330, 48, 285, 355, 210, 25, 315][Math.floor(Math.random() * 7)];
      this.petals = 5 + Math.floor(Math.random() * 3);
      this.phase = Math.random() * Math.PI * 2;
      this.h = rand(18, 36);
      this.lean = rand(-0.25, 0.25);
    }

    get s() { return scaleAt(this.y); }

    draw(t) {
      const s = this.s;
      const sway = Math.sin(t * 1.3 + this.phase) * 3.4 * s + this.lean * 10 * s;
      const bx = this.x, by = this.y;
      const tx = bx + sway;
      const ty = by - this.h * s;

      // Тень
      ctx.fillStyle = 'rgba(30, 70, 30, 0.13)';
      ctx.beginPath();
      ctx.ellipse(bx, by + 1, 8 * s, 2.6 * s, 0, 0, Math.PI * 2);
      ctx.fill();

      // Стебель
      ctx.strokeStyle = '#3f9142';
      ctx.lineWidth = 2.4 * s;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.quadraticCurveTo(bx + sway * 0.3, by - this.h * s * 0.55, tx, ty);
      ctx.stroke();

      // Листик
      ctx.fillStyle = '#4aa54c';
      const side = this.phase > Math.PI ? 1 : -1;
      ctx.beginPath();
      ctx.ellipse(bx + side * 6 * s, by - this.h * s * 0.42, 7 * s, 3.2 * s, side * 0.6, 0, Math.PI * 2);
      ctx.fill();

      // Лепестки
      const wob = Math.sin(t * 0.9 + this.phase) * 0.09;
      for (let i = 0; i < this.petals; i++) {
        const a = (i / this.petals) * Math.PI * 2 + wob;
        const px = tx + Math.cos(a) * 5.2 * s;
        const py = ty + Math.sin(a) * 5.2 * s;
        ctx.fillStyle = `hsl(${this.hue} 88% 79%)`;
        ctx.strokeStyle = `hsl(${this.hue} 68% 63%)`;
        ctx.lineWidth = 0.9 * s;
        ctx.beginPath();
        ctx.ellipse(px, py, 5.2 * s, 3.6 * s, a, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      // Серединка
      ctx.fillStyle = `hsl(${(this.hue + 45) % 360} 92% 60%)`;
      ctx.beginPath();
      ctx.arc(tx, ty, 3.3 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = `hsl(${(this.hue + 45) % 360} 92% 78%)`;
      ctx.beginPath();
      ctx.arc(tx - 1 * s, ty - 1 * s, 1.3 * s, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ---------- Фон ---------- */
  function drawSun(t) {
    const sx = W * 0.83;
    const sy = H * 0.13;
    const r = Math.min(W, H) * 0.055;

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(t * 0.12);
    ctx.strokeStyle = 'rgba(255, 214, 90, 0.55)';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * (r + 13), Math.sin(a) * (r + 13));
      ctx.lineTo(Math.cos(a) * (r + 29), Math.sin(a) * (r + 29));
      ctx.stroke();
    }
    ctx.restore();

    const g = ctx.createRadialGradient(sx, sy, r * 0.2, sx, sy, r * 2.1);
    g.addColorStop(0, 'rgba(255, 245, 190, 0.95)');
    g.addColorStop(0.45, 'rgba(255, 216, 90, 0.55)');
    g.addColorStop(1, 'rgba(255, 216, 90, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(sx, sy, r * 2.1, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffd93b';
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawCloud(c) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(c.s, c.s);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
    const puffs = [
      [-42, 2, 24], [-14, -12, 31], [22, -6, 25],
      [52, 6, 17], [6, 12, 22], [-24, 12, 19]
    ];
    ctx.beginPath();
    for (const [x, y, r] of puffs) {
      ctx.moveTo(x + r, y);
      ctx.arc(x, y, r, 0, Math.PI * 2);
    }
    ctx.fill();
    ctx.restore();
  }

  function drawHills() {
    ctx.fillStyle = '#a9dc8b';
    ctx.beginPath();
    ctx.moveTo(0, groundY + 6);
    ctx.quadraticCurveTo(W * 0.22, groundY - 80, W * 0.46, groundY + 2);
    ctx.quadraticCurveTo(W * 0.72, groundY - 62, W, groundY + 8);
    ctx.lineTo(W, groundY + 60);
    ctx.lineTo(0, groundY + 60);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#8ec96e';
    ctx.beginPath();
    ctx.moveTo(0, groundY + 22);
    ctx.quadraticCurveTo(W * 0.33, groundY - 46, W * 0.66, groundY + 16);
    ctx.quadraticCurveTo(W * 0.86, groundY + 34, W, groundY + 12);
    ctx.lineTo(W, groundY + 70);
    ctx.lineTo(0, groundY + 70);
    ctx.closePath();
    ctx.fill();
  }

  function drawTufts(t) {
    ctx.lineCap = 'round';
    for (const g of tufts) {
      const sway = Math.sin(t * 1.6 + g.phase) * 1.8 * g.s;
      ctx.strokeStyle = `hsl(${g.hue} 48% 42% / 0.55)`;
      ctx.lineWidth = 2 * g.s;
      ctx.beginPath();
      ctx.moveTo(g.x, g.y);
      ctx.quadraticCurveTo(g.x + sway * 0.5, g.y - g.h * g.s * 0.6, g.x + sway, g.y - g.h * g.s);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(g.x + 3 * g.s, g.y);
      ctx.quadraticCurveTo(g.x + 3 * g.s + sway * 0.4, g.y - g.h * g.s * 0.4, g.x + 3 * g.s + sway * 0.8, g.y - g.h * g.s * 0.7);
      ctx.stroke();
    }
  }

  /* ---------- Цикл ---------- */
  function update(dt, t) {
    for (const c of clouds) {
      c.x += c.v * dt;
      if (c.x > W + 140) { c.x = -140; c.y = H * 0.04 + Math.random() * H * 0.20; }
    }
    for (const s of sheep) s.update(dt);
  }

  function render(t) {
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, groundY + 2);

    drawSun(t);
    for (const c of clouds) drawCloud(c);

    drawHills();

    ctx.fillStyle = fieldGrad;
    ctx.fillRect(0, groundY, W, H - groundY);

    drawTufts(t);

    const items = sheep.concat(flowers);
    items.sort((a, b) => a.y - b.y);
    for (const it of items) it.draw(t);
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    const t = now / 1000;
    update(dt, t);
    render(t);
    requestAnimationFrame(loop);
  }

  /* ---------- Взаимодействие ---------- */
  function hitSheep(mx, my) {
    const sorted = sheep.slice().sort((a, b) => b.y - a.y);
    for (const s of sorted) {
      const sc = s.s;
      const cx = s.x;
      const cy = s.y - 30 * sc;
      const dx = (mx - cx) / (36 * sc);
      const dy = (my - cy) / (34 * sc);
      if (dx * dx + dy * dy < 1) return s;
    }
    return null;
  }

  function updateCounts() {
    document.getElementById('sheepCount').textContent = sheep.length;
    document.getElementById('flowerCount').textContent = flowers.length;
  }

  function addSheepAt(x, y) {
    if (sheep.length >= MAX_SHEEP) return;
    sheep.push(new Sheep(x, y));
    updateCounts();
  }

  function addFlowerAt(x, y) {
    if (flowers.length >= MAX_FLOWERS) return;
    flowers.push(new Flower(x, y));
    updateCounts();
  }

  canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    const hit = hitSheep(mx, my);
    if (hit) {
      hit.jump();
      return;
    }

    if (my > groundY + 10) {
      addFlowerAt(mx, my);
      for (let i = 0; i < 4; i++) {
        if (Math.random() < 0.5) {
          addFlowerAt(mx + rand(-30, 30), my + rand(-6, 26));
        }
      }
    }
  });

  document.getElementById('addSheep').addEventListener('click', () => {
    addSheepAt(
      rand(80, Math.max(90, W - 80)),
      rand(groundY + 60, Math.max(groundY + 80, H - 50))
    );
  });

  document.getElementById('addFlower').addEventListener('click', () => {
    addFlowerAt(
      rand(40, Math.max(50, W - 40)),
      rand(groundY + 20, Math.max(groundY + 40, H - 20))
    );
  });

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));

  /* ---------- Старт ---------- */
  function init() {
    resize();

    const sheepCount = W < 600 ? 4 : 6;
    for (let i = 0; i < sheepCount; i++) {
      addSheepAt(rand(80, W - 80), rand(groundY + 60, Math.max(groundY + 90, H - 50)));
    }

    const flowerCount = W < 600 ? 16 : 30;
    for (let i = 0; i < flowerCount; i++) {
      addFlowerAt(rand(15, W - 15), rand(groundY + 12, H - 8));
    }

    updateCounts();
    requestAnimationFrame(loop);
  }

  init();
})();
</script>
</body>
</html>
